# Puts the notes from docs/release-notes/<tag>.md on releases that already exist, as github-actions[bot].
# New releases get their notes from the Build workflow; this is for fixing or rewording older ones.
name: Release notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.28, or all"
        required: true
        default: all

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Set the notes
        run: |
          [[ "$TAG" == all || "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a version tag: $TAG"; exit 1; }
          tags=$(gh release list --limit 100 --json tagName --jq '.[].tagName')
          [ "$TAG" = all ] || tags="$TAG"
          for t in $tags; do
            f="docs/release-notes/$t.md"
            if [ -s "$f" ]; then gh release edit "$t" --notes-file "$f" && echo "Notes set: $t"; else echo "No notes file for $t, left as is"; fi
          done
