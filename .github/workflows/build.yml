name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # only used on a version tag, to make a DRAFT release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests (core and app)
        run: cargo test --workspace
      - name: Build the Windows installer
        working-directory: app
        run: npx --yes @tauri-apps/cli@2.12.4 build
      - name: Name the installer
        shell: pwsh
        run: |
          $v = (Get-Content app/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "target/release/bundle/nsis/*-setup.exe" "out/SterlingQuestSync_${v}_x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: SterlingQuestSync-windows
          path: out/*.exe
          if-no-files-found: error
      # Releases start as drafts. The owner signs the installer on their own PC (the signing key never
      # touches GitHub), then the signature and latest.json are added and the draft is published.
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Sterling Quest Sync Companion ${{ github.ref_name }}
          files: out/*.exe
