[package]
name = "sqs-core"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
hex = "0.4.3"
keyring = "4.2.0"
notify = "8.2.2"
rand = "0.10.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.40.3"
thiserror = "2.0.21"
zip = "9.6.0"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
